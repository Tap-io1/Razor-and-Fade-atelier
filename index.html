<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Razor & Fade Atelier</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #080808;
    color: #ffffff;
    overflow-x: hidden;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 25px 20px 35px;
    text-align: center;
}

/* LOGO */

.logo-wrapper {
    width: 100%;
    height: 300px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin-bottom: 12px;
}

.logo {
    width: 300px;
    height: 300px;

    max-width: 90vw;

    object-fit: contain;

    display: block;
}

/* STORE NAME */

.store-name {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #ffffff;
    margin-bottom: 8px;
    text-transform: uppercase;
}

/* ADDRESS */

.address {
    font-size: 14px;
    color: #bdbdbd;
    margin-bottom: 23px;
}

/* DIVIDER */

.divider {
    width: 55px;
    height: 1px;

    background: #D4AF37;

    margin: 0 auto 24px;

    opacity: 0.8;
}

/* BUTTONS */

.buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    width: 100%;

    min-height: 59px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 12px;

    padding: 15px 20px;

    color: #ffffff;

    text-decoration: none;

    font-size: 15px;
    font-weight: 600;

    background: transparent;

    border: 1px solid #D4AF37;

    border-radius: 12px;

    transition: 0.2s ease;
}

.btn:hover {
    background: rgba(212,175,55,0.08);
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(0.98);
}

/* ICONS */

.icon {
    width: 23px;
    height: 23px;
    flex-shrink: 0;
}

/* FOOTER */

.footer-line {
    display: flex;
    align-items: center;
    justify-content: center;

    margin-top: 30px;
}

.footer-line::before,
.footer-line::after {
    content: "";

    width: 55px;
    height: 1px;

    background: #D4AF37;

    opacity: 0.4;
}

.footer-symbol {
    margin: 0 12px;

    font-size: 14px;

    color: #D4AF37;
}

.footer {
    margin-top: 15px;

    font-size: 11px;

    color: #777777;

    letter-spacing: 1.5px;
}

/* MOBILE */

@media (max-width: 380px) {

    .container {
        padding-left: 15px;
        padding-right: 15px;
    }

    .logo-wrapper {
        height: 275px;
    }

    .logo {
        width: 275px;
        height: 275px;
    }

    .store-name {
        font-size: 20px;
    }

    .btn {
        min-height: 55px;
        font-size: 14px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LOGO -->

    <div class="logo-wrapper">
